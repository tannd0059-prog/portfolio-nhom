<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Nguyễn Đăng Khôi</title>
  <meta name="description" content="Portfolio cá nhân của Nguyễn Đăng Khôi - sinh viên Công nghệ thông tin, Computer Science.">
  <meta name="author" content="Nguyễn Đăng Khôi">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sections.css">
  <link rel="stylesheet" href="assets/css/effects.css">

  <!-- Đặt chủ đề sáng/tối ngay từ đầu để tránh bị nháy màu khi tải trang -->
  <script>
    document.documentElement.classList.add("js");
    try {
      var t = localStorage.getItem("theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
  </script>
</head>

<body>
  <a class="skip-link" href="#main">Bỏ qua điều hướng</a>
  <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

  <!-- ============ HEADER / NAVBAR ============ -->
  <header class="navbar" id="navbar">
    <a href="#top" class="brand" id="brand" aria-label="Về đầu trang"></a>
    <nav class="nav-links" id="navLinks" aria-label="Điều hướng chính"></nav>
    <div class="nav-actions" id="navActions">
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Đổi giao diện sáng/tối"><i class="fa fa-moon-o" aria-hidden="true"></i></button>
      <button class="icon-btn menu-btn" id="menuToggle" type="button" aria-label="Mở menu" aria-expanded="false" aria-controls="navLinks"><i class="fa fa-bars" aria-hidden="true"></i></button>
    </div>
  </header>

  <main id="main">
    <!-- ============ BANNER / HERO ============ -->
    <section class="hero" id="top" aria-labelledby="heroTitle">
      <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
      <canvas class="hero-canvas" id="heroCanvas" aria-hidden="true"></canvas>

      <div class="hero-inner">
        <div class="avatar-wrap" id="avatarWrap">
          <div class="avatar-ring" aria-hidden="true"></div>
          <img class="avatar" id="heroAvatar" src="" alt="" width="640" height="640">
          <div class="chips" id="heroChips" aria-hidden="true"></div>
        </div>

        <p class="hello">Xin chào 👋</p>
        <h1 id="heroTitle"><span class="grad-text" id="heroName">Nguyễn Đăng Khôi</span></h1>
        <p class="role"><span class="role-prefix">Mình là </span><span class="typed" id="typed" aria-live="off"></span><span class="caret" aria-hidden="true"></span></p>
        <p class="tagline" id="heroTagline"></p>

        <div class="hero-actions" id="heroActions"></div>
        <div class="social-row" id="heroSocial"></div>
        <ul class="hero-stats" id="heroStats" aria-label="Số liệu nhanh"></ul>
      </div>

      <a class="scroll-hint" href="#about" aria-label="Cuộn xuống phần Về tôi"><span></span></a>
    </section>

    <!-- Dải công nghệ chạy ngang -->
    <div class="marquee" id="marquee" aria-hidden="true"><div class="marquee-track" id="marqueeTrack"></div></div>

    <!-- ============ CÁC PHẦN NỘI DUNG (nội dung do render.js điền từ content.js) ============ -->
    <section class="section" id="about" aria-labelledby="about-title">
      <div class="container reveal">
        <header class="section-head"><h2 class="section-title" id="about-title">Về tôi</h2></header>
        <div class="section-body"></div>
      </div>
    </section>

    <section class="section alt" id="goal" aria-labelledby="goal-title">
      <div class="container reveal">
        <header class="section-head"><h2 class="section-title" id="goal-title">Mục tiêu nghề nghiệp</h2></header>
        <div class="section-body"></div>
      </div>
    </section>

    <section class="section" id="specialization" aria-labelledby="specialization-title">
      <div class="container reveal">
        <header class="section-head"><h2 class="section-title" id="specialization-title">Chuyên ngành của mình</h2></header>
        <div class="section-body"></div>
      </div>
    </section>

    <section class="section alt" id="education" aria-labelledby="education-title">
      <div class="container reveal">
        <header class="section-head"><h2 class="section-title" id="education-title">Học vấn & Hoạt động</h2></header>
        <div class="section-body"></div>
      </div>
    </section>

    <section class="section" id="skills" aria-labelledby="skills-title">
      <div class="container reveal">
        <header class="section-head"><h2 class="section-title" id="skills-title">Kỹ năng</h2></header>
        <div class="section-body"></div>
      </div>
    </section>

    <section class="section alt" id="projects" aria-labelledby="projects-title">
      <div class="container reveal">
        <header class="section-head"><h2 class="section-title" id="projects-title">Dự án</h2></header>
        <div class="section-body"></div>
      </div>
    </section>

    <section class="section" id="awards" aria-labelledby="awards-title">
      <div class="container reveal">
        <header class="section-head"><h2 class="section-title" id="awards-title">Thành tích & Chứng chỉ</h2></header>
        <div class="section-body"></div>
      </div>
    </section>

    <section class="section alt" id="gallery" aria-labelledby="gallery-title">
      <div class="container reveal">
        <header class="section-head"><h2 class="section-title" id="gallery-title">Khoảnh khắc</h2></header>
        <div class="section-body"></div>
      </div>
    </section>

    <section class="section" id="interests" aria-labelledby="interests-title">
      <div class="container reveal">
        <header class="section-head"><h2 class="section-title" id="interests-title">Sở thích & Ẩm thực</h2></header>
        <div class="section-body"></div>
      </div>
    </section>

    <!-- ============ LIÊN HỆ (form tĩnh, kiểm tra bằng form.js) ============ -->
    <section class="section alt" id="contact" aria-labelledby="contact-title">
      <div class="container reveal">
        <header class="section-head"><h2 class="section-title" id="contact-title">Liên hệ</h2></header>
        <div class="contact-grid">
          <div class="contact-info" id="contactInfo"></div>

          <form class="contact-form card" id="contactForm" novalidate>
            <h3 class="form-title"><i class="fa fa-paper-plane" aria-hidden="true"></i> Gửi lời nhắn</h3>

            <div class="field">
              <label for="cName">Họ và tên</label>
              <input id="cName" name="name" type="text" autocomplete="name" placeholder="Nguyễn Văn A" aria-describedby="cName-err" required>
              <p class="error" id="cName-err" role="alert"></p>
            </div>

            <div class="field">
              <label for="cEmail">Email</label>
              <input id="cEmail" name="email" type="email" autocomplete="email" placeholder="ban@example.com" aria-describedby="cEmail-err" required>
              <p class="error" id="cEmail-err" role="alert"></p>
            </div>

            <div class="field">
              <label for="cSubject">Chủ đề</label>
              <input id="cSubject" name="subject" type="text" placeholder="Mời hợp tác dự án..." aria-describedby="cSubject-err" required>
              <p class="error" id="cSubject-err" role="alert"></p>
            </div>

            <div class="field">
              <label for="cMessage">Lời nhắn</label>
              <textarea id="cMessage" name="message" rows="5" maxlength="500" placeholder="Bạn muốn nói gì với mình?" aria-describedby="cMessage-err cMessage-count" required></textarea>
              <div class="field-foot">
                <p class="error" id="cMessage-err" role="alert"></p>
                <span class="counter" id="cMessage-count">0/500</span>
              </div>
            </div>

            <button class="btn primary submit" type="submit"><i class="fa fa-send" aria-hidden="true"></i> Gửi lời nhắn</button>
            <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="footer" id="footer"></footer>

  <button class="to-top" id="toTop" type="button" aria-label="Lên đầu trang"><i class="fa fa-angle-up" aria-hidden="true"></i></button>

  <!-- Hộp thoại chi tiết dự án -->
  <dialog class="modal" id="modal" aria-label="Chi tiết dự án">
    <button class="modal-close icon-btn" type="button" aria-label="Đóng"><i class="fa fa-times" aria-hidden="true"></i></button>
    <div class="modal-body"></div>
  </dialog>

  <!-- Nội dung của bạn nằm trong assets/js/content.js -->
  <script src="assets/js/content.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/gallery.js"></script>
  <script src="assets/js/effects.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/form.js"></script>
</body>
</html>
